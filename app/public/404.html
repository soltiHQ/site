<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex,follow" />
  <link rel="icon" type="image/svg+xml" href="/docs/solti-logo-dark.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>Page not found · Solti</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #141a21;
      background: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 20rem;
      min-height: 100vh;
      margin: 0;
      background: #fff;
    }

    .shell {
      display: grid;
      width: min(calc(100% - clamp(2rem, 10vw, 10rem)), 80rem);
      min-height: 100vh;
      grid-template-rows: auto 1fr auto;
      margin-inline: auto;
    }

    .site-header,
    .site-footer {
      display: flex;
      min-height: 4.5rem;
      align-items: center;
      justify-content: space-between;
      border-color: #d8dee6;
      color: #606a78;
    }

    .site-header {
      border-bottom: 1px solid #d8dee6;
    }

    .site-footer {
      border-top: 1px solid #d8dee6;
      font-size: 0.875rem;
    }

    .brand,
    .home-link {
      color: inherit;
      text-decoration: none;
    }

    .brand {
      color: #141a21;
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .brand::after {
      display: inline-block;
      width: 0.35rem;
      height: 0.35rem;
      margin-left: 0.25rem;
      border-radius: 50%;
      background: #2f9e58;
      content: "";
      vertical-align: 0.05em;
    }

    main {
      display: grid;
      max-width: 58rem;
      align-content: center;
      padding-block: clamp(5rem, 14vh, 9rem);
    }

    .eyebrow {
      margin: 0 0 1.5rem;
      color: #24713f;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 11ch;
      margin: 0;
      font-family: "IBM Plex Serif", Georgia, serif;
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 0.96;
    }

    .lede {
      max-width: 38rem;
      margin: 2rem 0 0;
      color: #4d5765;
      font-size: clamp(1rem, 1.6vw, 1.2rem);
      line-height: 1.65;
    }

    .home-link {
      display: inline-flex;
      min-height: 2.75rem;
      align-items: center;
      margin-top: 2rem;
      padding: 0.75rem 1rem;
      border: 1px solid #141a21;
      border-radius: 0.3rem;
      color: #141a21;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .home-link:hover {
      border-color: #24713f;
      color: #24713f;
    }

    .home-link:focus-visible {
      outline: 2px solid #24713f;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Solti home">solti</a>
    </header>

    <main>
      <p class="eyebrow">404 · Page not found</p>
      <h1>This path does not exist.</h1>
      <p class="lede">
        The page may have moved, or the address may be incorrect. Return to Solti and continue from there.
      </p>
      <div>
        <a class="home-link" href="/">Back to Solti</a>
      </div>
    </main>

    <footer class="site-footer">
      <span>Open-source task execution stack.</span>
    </footer>
  </div>
</body>
</html>
